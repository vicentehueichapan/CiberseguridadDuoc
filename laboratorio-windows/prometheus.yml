# Prometheus consulta las metricas de la app cada 5 segundos (produccion :5000 y staging :5001).
global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: produccion
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:5000"]
  - job_name: staging
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:5001"]
